# Shared entity definitions, included by both hardware-variant YAML files
# via `<<: !include common_entities.yaml`. The UART pins and esp32: block
# differ per hardware variant and stay in the top-level files.

lv_classic300s_humidifier:
  id: humidifier
  uart_id: a5_uart_bus
  status_interval: 15s

  current_humidity:
    name: "Current Humidity"
  target_humidity:
    name: "Target Humidity"
  temperature:
    name: "Temperature"
  night_light:
    name: "Night Light Level"
    # Disabled by default: while a Breathe/Error Flash notification effect
    # is running, the appliance echoes a new night_light value on almost
    # every status frame (~every 150-400ms, matching the effect's own
    # update_interval), so this sensor would otherwise publish several
    # times a second for as long as an effect runs -- noisy in the logs and
    # in HA's recorder/history for a value nobody actually needs tracked
    # over time (the Night Light *light* entity already shows the current
    # brightness, and deliberately does NOT flicker like this during an
    # effect -- see light: below). Enable it in the device's entity list in
    # HA if you specifically want to graph/debug raw night light level.
    disabled_by_default: true
  output_level:
    name: "Output Level"
    icon: "mdi:water"

  power:
    name: "Power State"
    id: power_state
    on_state:
      then:
        - script.execute: apply_night_light_state
  tank_removed:
    name: "Tank Removed"
    id: tank_removed
    on_state:
      then:
        - script.execute: apply_night_light_state
  water_empty:
    name: "Water Empty"
    id: water_empty
    on_state:
      then:
        - script.execute: apply_night_light_state
  mist_active:
    name: "Mist Active"
    id: mist_active
    on_state:
      then:
        - script.execute: apply_night_light_state
  display:
    name: "Display State"
  target_stop_active:
    name: "Target Stop Active"

  mode:
    name: "Mode (raw)"
    entity_category: diagnostic
  error:
    name: "Error Code"
  last_status_frame:
    name: "Last Status Frame"
    entity_category: diagnostic
    # Disabled by default, for the same reason as night_light: above --
    # unlike every other field in handle_status_payload_(), this one
    # publishes unconditionally on *every* parsed status frame (no
    # change-gating, by design -- it's a raw diagnostic dump), so during an
    # active notification effect it republishes several times a second for
    # as long as the effect runs. Enable it in HA only while actively
    # debugging the UART protocol; leave it off for normal use.
    disabled_by_default: true

  # The MCU reports physical power-button long-presses; stock firmware uses
  # ~5s hold for WiFi pairing/reconnect and ~15s for factory reset. Wire up
  # your own recovery behavior here -- a plain reboot is a reasonable start.
  on_power_button_hold_5s:
    - logger.log: "Power button held ~5s"
  on_power_button_hold_15s:
    - logger.log: "Power button held ~15s -- rebooting"
    - button.press: restart_button

switch:
  - platform: lv_classic300s_humidifier
    lv_classic300s_humidifier_id: humidifier
    power:
      name: "Power"
    display:
      name: "Display"
    stop_at_target:
      name: "Stop At Target"

  # Independent enable/disable for each Night Light notification behavior --
  # some people want only one of the two. Both OFF: Night Light is just a
  # plain manual light, untouched by automation. Either ON: Night Light gets
  # reclaimed by apply_night_light_state below whenever its condition is
  # true, and forced off when neither enabled condition currently applies
  # (so manual control while at least one of these is on gets overridden).
  #
  # These write to `night_light_problem_enabled`/`night_light_operating_
  # enabled` (globals, see below) rather than being read back via
  # `switch.is_on:` from apply_night_light_state. That's deliberate: a
  # template switch's turn_on_action/turn_off_action runs *before* the
  # switch publishes its own new state (see
  # esphome/components/template/switch/template_switch.cpp), so a script
  # checking `switch.is_on:` on the very switch whose action just called it
  # would still read the OLD value. Setting a global first, synchronously,
  # sidesteps that entirely -- this is also why the actions below run
  # globals.set *then* script.execute, in that order, on both switches.
  - platform: template
    id: night_light_problem_notifications
    name: "Night Light Problem Notification"
    icon: "mdi:alert-circle-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - globals.set:
          id: night_light_problem_enabled
          value: "true"
      - script.execute: apply_night_light_state
    turn_off_action:
      - globals.set:
          id: night_light_problem_enabled
          value: "false"
      - script.execute: apply_night_light_state

  - platform: template
    id: night_light_operating_notifications
    name: "Night Light Operating Notification"
    icon: "mdi:bell-ring-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - globals.set:
          id: night_light_operating_enabled
          value: "true"
      - script.execute: apply_night_light_state
    turn_off_action:
      - globals.set:
          id: night_light_operating_enabled
          value: "false"
      - script.execute: apply_night_light_state

number:
  - platform: lv_classic300s_humidifier
    lv_classic300s_humidifier_id: humidifier
    manual_level:
      name: "Manual Mist Level"
    auto_target_humidity:
      name: "Auto Target Humidity"
    sleep_target_humidity:
      name: "Sleep Target Humidity"

select:
  - platform: lv_classic300s_humidifier
    lv_classic300s_humidifier_id: humidifier
    mode:
      name: "Mode"

light:
  # Night Light as a real dimmable light entity (on/off + 0-100% brightness),
  # kept in sync with what the appliance MCU reports. Doubles as a status
  # indicator via the two effects below when "Night Light Problem
  # Notification" and/or "Night Light Operating Notification" are on --
  # see apply_night_light_state script.
  - platform: lv_classic300s_humidifier
    lv_classic300s_humidifier_id: humidifier
    id: night_light
    name: "Night Light"
    # ESPHome's own light: default is restore_mode: ALWAYS_OFF -- at every
    # boot, LightState::setup() would otherwise issue a real, explicit
    # LightCall(state=false) before this platform's own sync_from_parent_()
    # ever runs, and that call reaches write_state() -> set_night_light(0),
    # i.e. an actual UART command physically turning the appliance's Night
    # Light off. Since this entity's source of truth is the appliance's own
    # echoed state (not ESPHome's flash), that forced-off then "sticks":
    # the next status frame just reports back the off state we ourselves
    # just commanded, so nothing self-corrects. RESTORE_DEFAULT_OFF instead
    # restores the state+brightness ESPHome last saved -- which tracks the
    # real appliance state, since sync_from_parent_()'s LightCall is not
    # marked set_save(false) (only the effect ticks are, deliberately, to
    # avoid flash wear -- see the effects below), so this ends up
    # commanding back on at essentially the same level it was already at,
    # a practical no-op, instead of a real forced turn-off on every reboot.
    restore_mode: RESTORE_DEFAULT_OFF
    # Re-apply whatever the notification switches say should currently be
    # showing whenever the light transitions off->on -- covers manually
    # turning the Night Light entity back on (HA UI, an automation, or an
    # off/on cycle), which otherwise leaves it sitting at a static manual
    # brightness even though a notification switch is still enabled. Only
    # fires on an actual off->on transition (not on every brightness tweak
    # while already on), and is a no-op if both notification switches are
    # off -- see apply_night_light_state below. Also fires when
    # apply_night_light_state's own light.turn_on: calls turn the light on
    # from off; that's a harmless redundant re-evaluation (mode: restart
    # makes it safe), not a loop -- current_values is already "on" by then,
    # so the trigger's own off->on edge detection doesn't fire again.
    on_turn_on:
      - script.execute: apply_night_light_state
    effects:
      # NOTE: both effects below drive the *real* light over the same A5
      # UART link used for status polling (there is no local GPIO LED --
      # Night Light is a remote light on the appliance MCU). Each effect
      # tick sends an actual UART command, so the update_interval doubles
      # as the command rate on that bus. The original 40ms/250ms intervals
      # (~25 and ~4 commands/sec) were fast enough to starve the MCU's
      # replies to our periodic status polls, which froze tank_removed/
      # water_empty/mist_active at stale values for as long as an effect
      # was running -- so notifications never re-evaluated on their own.
      # 150ms/400ms is a middle ground: clearly lower traffic than the
      # original without looking as choppy as a full 400ms Breathe step.
      # This threshold isn't precisely characterized (no exact "safe" rate
      # is documented for the appliance MCU) -- if flashing-over-breathing
      # ever gets stuck again, raise Breathe's update_interval back up.
      # Step sizes are scaled to match each interval so the perceived
      # cycle speed stays the same as the original 40ms/0.01 design.
      #
      # Both effects also call set_publish(false)/set_save(false): these
      # per-tick calls still drive the *actual* hardware (current_values +
      # write_state() aren't gated by publish/save), but skip re-announcing
      # the light's HA-facing state and skip a flash-preference write on
      # every single tick. Without this, the Night Light entity in HA would
      # visibly flicker between 0-100% / on-off several times a second
      # while a notification effect runs, and the ESP's flash would get a
      # preference write at the same rate -- same technique ESPHome's own
      # built-in PulseLightEffect uses.
      - lambda:
          name: "Error Flash"
          update_interval: 400ms
          lambda: |-
            static bool led_on = false;
            led_on = !led_on;
            auto call = id(night_light).turn_on();
            call.set_brightness(led_on ? 1.0f : 0.0f);
            call.set_transition_length(0);
            call.set_publish(false);
            call.set_save(false);
            call.perform();
      - lambda:
          name: "Breathe"
          update_interval: 150ms
          lambda: |-
            static float level = 0.05f;
            static int8_t dir = 1;
            level += dir * 0.0375f;
            if (level >= 1.0f) {
              level = 1.0f;
              dir = -1;
            }
            if (level <= 0.05f) {
              level = 0.05f;
              dir = 1;
            }
            auto call = id(night_light).turn_on();
            call.set_brightness(level);
            call.set_transition_length(0);
            call.set_publish(false);
            call.set_save(false);
            call.perform();

button:
  - platform: restart
    id: restart_button
    name: "Restart"

  - platform: template
    name: "Reset Cleaning Reminder"
    icon: "mdi:broom"
    entity_category: config
    on_press:
      - globals.set:
          id: mist_runtime_seconds
          value: "0"

binary_sensor:
  # Cumulative-runtime reminder: on after ~3 days (72h) of *actual misting*
  # time have accumulated since the last reset. Press "Reset Cleaning
  # Reminder" after you clean the tank/wick to zero the counter.
  - platform: template
    name: "Needs Cleaning"
    icon: "mdi:broom"
    entity_category: diagnostic
    lambda: |-
      return id(mist_runtime_seconds) >= (72.0f * 3600.0f);

  # Calendar-time reminder: on when the appliance hasn't misted at all in
  # ~3 days (72h) -- water sitting unused in the tank that long should be
  # replaced before the next use. Clears itself as soon as it's used again.
  - platform: template
    name: "Replace Water"
    icon: "mdi:water-alert-outline"
    entity_category: diagnostic
    lambda: |-
      if (id(last_mist_epoch) == 0)
        return false;
      auto now = id(ha_time).now();
      if (!now.is_valid())
        return false;
      return (((int64_t) now.timestamp) - id(last_mist_epoch)) >= (72 * 3600);

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# Wall-clock time synced from Home Assistant, used only for the "Replace
# Water" calendar-time reminder above (no local RTC on the ESP32).
time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: mist_runtime_seconds
    type: float
    restore_value: true
    initial_value: "0"
  - id: last_mist_epoch
    type: int64_t
    restore_value: true
    initial_value: "0"
  # Mirror the two Night Light notification switches (see switch: above).
  # Not restore_value themselves -- each switch's own setup() always calls
  # turn_on()/turn_off() once at boot (restore_mode: RESTORE_DEFAULT_ON
  # guarantees a definite value), which sets these correctly via
  # turn_on_action/turn_off_action before the humidifier hub's first status
  # response can trigger apply_night_light_state.
  - id: night_light_problem_enabled
    type: bool
    restore_value: false
    initial_value: "true"
  - id: night_light_operating_enabled
    type: bool
    restore_value: false
    initial_value: "true"
  # What the Night Light entity looked like right before a notification
  # effect (Error Flash / Breathe) last seized it -- captured once, the
  # moment an effect starts from a fully-manual state (see the "only if not
  # already mid-effect" guards in apply_night_light_state below, so a
  # Breathe->Error Flash priority handover doesn't overwrite this with the
  # effect's own transient state). Used to put the entity back exactly
  # where the user left it once neither notification condition applies
  # anymore, instead of just leaving it wherever the last effect tick
  # happened to land it.
  - id: night_light_pre_effect_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: night_light_pre_effect_brightness
    type: float
    restore_value: false
    initial_value: "1.0"

# Ticks the maintenance-reminder counters once a minute. Kept to a plain
# interval (rather than reacting to mist_active's on_state) so the "used
# within the last 3 days" clock advances even while it's actively misting.
interval:
  - interval: 60s
    then:
      - if:
          condition:
            binary_sensor.is_on: mist_active
          then:
            - globals.set:
                id: mist_runtime_seconds
                value: !lambda "return id(mist_runtime_seconds) + 60.0f;"
            - if:
                condition:
                  lambda: "return id(ha_time).now().is_valid();"
                then:
                  - globals.set:
                      id: last_mist_epoch
                      value: !lambda "return (int64_t) id(ha_time).now().timestamp;"

# Single place deciding what Night Light should be doing right now. Called
# by both notification switches (turn_on_action/turn_off_action), by
# on_state triggers on power/tank_removed/water_empty/mist_active, and by
# the light's own on_turn_on: (see light: above). Priority: problem flash >
# operating pulse > released for manual control. A switch only claims the
# light *while its own condition is actively true* -- being armed but
# currently idle (Problem enabled with no problem, Operating just switched
# off) releases the light rather than locking out manual control. See the
# globals: above for why this reads globals instead of `switch.is_on:`.
script:
  - id: apply_night_light_state
    mode: restart
    then:
      - if:
          # Do nothing until the hub has parsed at least one real 20-byte
          # status frame from the appliance. Without this guard, the two
          # notification switches restoring ON at boot (restore_mode:
          # RESTORE_DEFAULT_ON runs their turn_on_action, which calls this
          # script) would run this logic against power_state/mist_active/
          # etc. still sitting at their compile-time default of `false` --
          # concluding "neither condition applies" and forcing Night Light
          # off, even if the appliance is actually powered on and misting.
          # That bogus off then stuck until something toggled a switch,
          # since nothing re-ran this script afterwards on its own -- the
          # *sensors* did change to their real values once the first status
          # frame arrived (power/mist_active are among the fields forced to
          # publish on that first frame, see handle_status_payload_()'s
          # `first_status`), but re-evaluating with the right data only
          # happens if something calls this script again, which this guard
          # ensures: power/mist_active's own on_state: triggers do exactly
          # that, once real data is in, so the correct effect starts on its
          # own without needing a manual switch off/on.
          condition:
            lambda: "return id(humidifier).got_first_status();"
          then:
            - if:
                condition:
                  and:
                    - lambda: "return id(night_light_problem_enabled);"
                    # Only flash for a problem while the appliance is
                    # actually powered on. With Power off, pulling the tank
                    # to refill or clean it is routine, not a problem --
                    # without this check, Night Light would flash the whole
                    # time it's out.
                    - binary_sensor.is_on: power_state
                    - or:
                        - binary_sensor.is_on: water_empty
                        - binary_sensor.is_on: tank_removed
                then:
                  # Remember what the entity looked like before we seize it
                  # -- but only if nothing was already governing it (a
                  # Breathe->Error Flash priority handover shouldn't
                  # overwrite this with Breathe's own transient state).
                  - if:
                      condition:
                        lambda: "return id(night_light).get_current_effect_index() == 0;"
                      then:
                        - globals.set:
                            id: night_light_pre_effect_on
                            value: !lambda "return id(night_light).remote_values.is_on();"
                        - globals.set:
                            id: night_light_pre_effect_brightness
                            value: !lambda "return id(night_light).remote_values.get_brightness();"
                  - light.turn_on:
                      id: night_light
                      effect: "Error Flash"
                      brightness: 100%
                else:
                  - if:
                      condition:
                        and:
                          - lambda: "return id(night_light_operating_enabled);"
                          - binary_sensor.is_on: mist_active
                      then:
                        - if:
                            condition:
                              lambda: "return id(night_light).get_current_effect_index() == 0;"
                            then:
                              - globals.set:
                                  id: night_light_pre_effect_on
                                  value: !lambda "return id(night_light).remote_values.is_on();"
                              - globals.set:
                                  id: night_light_pre_effect_brightness
                                  value: !lambda "return id(night_light).remote_values.get_brightness();"
                        - light.turn_on:
                            id: night_light
                            effect: "Breathe"
                      else:
                        - if:
                            # Neither condition currently applies -- release
                            # the light. This used to force it off whenever
                            # at least one notification switch was armed,
                            # even if that switch's own condition wasn't
                            # currently true (e.g. Problem Notification on
                            # but no actual problem, or Operating
                            # Notification just switched off). That meant a
                            # switch being *armed* was enough to lock out
                            # manual control of the entity, which isn't what
                            # we want: each switch should only take the
                            # light over *while its own condition is
                            # actively true*, and hand it right back the
                            # moment it isn't -- Problem still wins priority
                            # over Operating (see the outer/middle branches
                            # above), but neither should claim the light
                            # just for being armed.
                            #
                            # So: if an effect is currently running, stop it
                            # and put the entity back exactly where it was
                            # *before* the first of the two blocks above
                            # seized it (night_light_pre_effect_on/
                            # _brightness) -- not wherever the effect's last
                            # tick happened to leave it. If no effect is
                            # running, this is a deliberate no-op -- don't
                            # touch a light nothing is governing.
                            condition:
                              lambda: "return id(night_light).get_current_effect_index() != 0;"
                            then:
                              - if:
                                  condition:
                                    lambda: "return id(night_light_pre_effect_on);"
                                  then:
                                    # Two steps, not one -- ESPHome's config
                                    # validation flat out rejects effect:
                                    # and transition_length: in the same
                                    # light.turn_on: (they're in the same
                                    # "transformer" exclusion group, along
                                    # with flash). Step 1 stops the running
                                    # effect (effect: "None"); step 2 then
                                    # snaps to the saved brightness with no
                                    # fade. Splitting them this way avoids
                                    # that conflict, and also sidesteps the
                                    # OTHER landmine -- combining effect:
                                    # "None" with state: false in one call
                                    # makes ESPHome log "cannot start effect
                                    # when turning off" and silently drop
                                    # the effect, so OFF is handled as its
                                    # own light.turn_off: below instead,
                                    # which stops any active effect on its
                                    # own without needing an effect: field.
                                    - light.turn_on:
                                        id: night_light
                                        effect: "None"
                                    - light.turn_on:
                                        id: night_light
                                        brightness: !lambda "return id(night_light_pre_effect_brightness);"
                                        transition_length: 0s
                                  else:
                                    - light.turn_off:
                                        id: night_light
                                        transition_length: 0s
