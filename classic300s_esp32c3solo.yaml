# Levoit Classic 300S -- newer WiFi module variant: ESP32-C3-SOLO-1.
#
# Use this file if `esptool.py flash_id` (or the module's own markings)
# reports an ESP32-C3 (RISC-V), not a classic single-core ESP32.
# See classic300s_esp32solo.yaml for the original ESP32-SOLO-1C variant.
#
# A5 UART protocol reverse-engineered by Maxim Pivovarov / MaxPi ("Taxom"):
# https://github.com/Taxom/levoit-classic-300s-uart-protocol (CC BY-NC-SA 4.0)

esphome:
  name: levoit-classic300s
  friendly_name: Levoit Classic 300S

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

# UART0 (GPIO20/GPIO21) is also the flashing/serial pins -- disable UART
# logging to avoid any interference and rely on WiFi/API logging instead.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Encryption reuses the api: key above (Noise NNpsk0) -- it both keeps
    # the firmware image confidential and authenticates the uploader, so a
    # separate password isn't needed and costs flash/RAM for nothing.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Levoit Classic 300S Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [lv_classic300s_humidifier]

# A5 bus to the appliance MCU. Newer ESP32-C3-SOLO-1 module pins. ESPHome
# will warn that GPIO18/19 are normally used by the USB-Serial-JTAG
# interface -- expected here, flashing/logging uses UART0 on GPIO20/21
# instead. See docs/A5_UART_protocol.md.
uart:
  id: a5_uart_bus
  rx_pin: GPIO18
  tx_pin: GPIO19
  baud_rate: 9600

packages:
  common: !include common_entities.yaml
